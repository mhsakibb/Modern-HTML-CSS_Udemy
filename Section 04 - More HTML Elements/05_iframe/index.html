<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS Sandbox</title>
  </head>
  <body>
    <h1>HTML & CSS Sandbox - iframe</h1>

    <!-- Webpage -->
    <iframe src="./test.html" frameborder="0"></iframe>

    <!-- Videos -->
    <iframe
      src="https://www.youtube.com/embed/Bjw25FwEE_k?si=4-srxw8sk2-vDBCw"
      frameborder="0"
      width="560"
      height="315"
    ></iframe>

    <!-- PDF -->
    <iframe
      src="./invoicesample.pdf"
      frameborder="0"
      width="500"
      height="315"
    ></iframe>

    <!-- Google Maps -->
    <iframe
      width="500"
      height="315"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6105.431085751237!2d90.35527921132837!3d23.812123150009302!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c12015382851%3A0x3ceca92fcf1a72d2!2sBangladesh%20University%20of%20Business%20and%20Technology%20(BUBT)!5e1!3m2!1sen!2sbd!4v1792253629174!5m2!1sen!2sbd"
    ></iframe>

    <!-- Google Calender -->
    <iframe
      width="500"
      height="315"
      src="https://calendar.google.com/calendar/embed?src=en.usa%23holiday%40group.v.calendar.google.com&ctz=America%2FLos_Angeles"
    ></iframe>

    <!-- embed -->
    <embed
      src="https://www.youtube.com/embed/DBTFWMVi4oA?si=n6HhwYpDr8FgLagi"
      width="500"
      height="315"
    />

    <!-- object -->
    <object
      data="https://www.youtube.com/embed/5h04AbM9J-M?si=9nOqZxFAGpWDwrPQ"
      width="500"
      height="315"
    />
  </body>
</html>
